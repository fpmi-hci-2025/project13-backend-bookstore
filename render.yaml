# Render.com Blueprint
# Deploy: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: bookstore-api
    runtime: docker
    repo: https://github.com/fpmi-hci-2025/project13-backend-bookstore
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bookstore-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: bookstore-db
    databaseName: bookstore
    user: bookstore
    plan: free

